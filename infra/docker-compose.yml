name: eventcore

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventcore
      POSTGRES_PASSWORD: eventcore
      POSTGRES_DB: eventcore
    ports:
      - '54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventcore -d eventcore']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://eventcore:eventcore@postgres:5432/eventcore
      AUTH_ISSUER: https://auth.eventcore.local
      AUTH_AUDIENCE: eventcore-api
      AUTH_DEMO_SECRET: ${AUTH_DEMO_SECRET:?Set AUTH_DEMO_SECRET in .env}
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://eventcore:eventcore@postgres:5432/eventcore
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
