name: Outbox

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: outbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    name: Drain the demo outbox and sweep invariants
    if: github.repository == 'IgorFelipe7/eventcore'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@eventcore/worker..."
      - run: pnpm --filter @eventcore/worker once
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
